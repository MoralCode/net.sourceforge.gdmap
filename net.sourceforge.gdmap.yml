app-id: net.sourceforge.gdmap
runtime: org.gnome.Platform
runtime-version: '44' # You can adjust this based on your SDK preference
sdk: org.gnome.Sdk
command: gdmap
finish-args:
  # X11 for the GUI
  - --socket=x11
  # File system access to scan disks (the purpose of the app)
  - --filesystem=host
  # Access to icons/themes
  - --device=dri
  - --share=ipc

modules:
  - shared-modules/gtk2/gtk2.json
  - name: gdmap
    buildsystem: autotools
    config-opts:
      - "LIBS=-lm"
    post-install:
      - mv ${FLATPAK_DEST}/share/applications/gdmap.desktop ${FLATPAK_DEST}/share/applications/net.sourceforge.gdmap.desktop
      - mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps
      # - ffmpeg -y -i ${FLATPAK_DEST}/share/pixmaps/gdmap_icon.png -vf "scale=128:128" ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/net.sourceforge.gdmap.png
      - mv ${FLATPAK_DEST}/share/pixmaps/gdmap_icon.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/net.sourceforge.gdmap.png

      - mv ${FLATPAK_DEST}/share/man/man1/gdmap.1 ${FLATPAK_DEST}/share/man/man1/net.sourceforge.gdmap.1
      # # 2. Install Desktop File
      # - install -Dm644 net.sourceforge.gdmap.desktop /app/share/applications/net.sourceforge.gdmap.desktop
      
      # # 3. Install Metadata
      # - install -Dm644 net.sourceforge.gdmap.metainfo.xml /app/share/metainfo/net.sourceforge.gdmap.metainfo.xml
      
      # # 4. Install Icon (Assuming you have a file named tmm.png)
      # - install -Dm644 tmm.png /app/share/icons/hicolor/256x256/apps/net.sourceforge.gdmap.png
      
    sources:
      - type: archive
        dest-filename: gdmap.tar.gz
        only-arches: [x86_64]
        url: https://sourceforge.net/projects/gdmap/files/latest/download
        sha256: a200c98004b349443f853bf611e49941403fce46f2335850913f85c710a2285b
      - type: shell
        commands:
          - sed -i 's/GTK_WIDGET_SET_FLAGS(\(.*\), GTK_CAN_FOCUS);/gtk_widget_set_can_focus(\1, TRUE);/g' src/gui_support.c
          - sed -i 's/GTK_WIDGET_SET_FLAGS/gtk_widget_set_flags/g' src/*.c || true
          # Replace macro checking sensitivity with gtk_widget_is_sensitive
          - sed -i 's/GTK_WIDGET_SENSITIVE(\([^)]*\))/gtk_widget_is_sensitive(\1)/g' src/gui_support.c
          # Catch any other instances across all C source files in src/
          - sed -i 's/GTK_WIDGET_SENSITIVE(\([^)]*\))/gtk_widget_is_sensitive(\1)/g' src/*.c || true
